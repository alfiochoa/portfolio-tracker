m-app/components/common/link"},{"type":"Internal","text":"UK group tax strategy","href":"/professional/tax-strategy","target":"_self","altText":"UK group tax strategy","ariaLabel":"UK group tax strategy",":type":"eds-aem-app/components/common/link"},{"type":"Internal","text":"X guidelines","href":"/professional/x-guidelines","target":"_self","altText":"X guidelines","ariaLabel":"X guidelines",":type":"eds-aem-app/components/common/link"},{"type":"External","text":"Modern Slavery and Human Trafficking Statement","href":"https://fund-docs.vanguard.com/Modern_Slavery_and_Human_Trafficking_Statement.pdf","target":"_blank","altText":"Modern Slavery and Human Trafficking Statement","ariaLabel":"Modern Slavery and Human Trafficking Statement",":type":"eds-aem-app/components/common/link"},{"type":"Internal","text":"Accessibility statement","href":"/professional/accessibility-statement","target":"_self","altText":"Accessibility statement","ariaLabel":"Accessibility statement",":type":"eds-aem-app/components/common/link"},{"type":"Internal","text":"Section 172 statement","href":"/professional/content/dam/intl/europe/documents/en/vas-section-172-statement.pdf","target":"_blank","altText":"Link to section 172 statement (PDF)","ariaLabel":"Link to section 172 statement (PDF)",":type":"eds-aem-app/components/common/link"},{"type":"External","text":"Careers","href":"https://www.vanguardjobs.com/","target":"_blank","altText":"Careers","ariaLabel":"Careers",":type":"eds-aem-app/components/common/link"},{"type":"Internal","text":"Press releases","href":"/professional/contact-us/press-releases","target":"_self",":type":"eds-aem-app/components/common/link"}]},":type":"eds-aem-app/components/containers/footer"},"cookie-policy":{"isAuthorRunMode":false,"cookiePolicyText":"\u003Ch2>Vanguard Asset Management, Limited\u003C/h2>\r\n\u003Ch3>Cookie policy\u003C/h3>\r\n\u003Cp>Vanguard Asset Management, Limited, and its affiliated companies (&quot;Vanguard,&quot; &quot;we&quot;, or &quot;us&quot;) use cookies on our websites operated within the United Kingdom (the “Sites”). This cookie policy provides you with detailed information about the types of cookies we use and the purposes for using those cookies. For information about how Vanguard collects, uses, and shares other types of information, please read our&nbsp;\u003Ca href=\"/privacy-policy.html\" title=\"Privacy policy\">privacy policy\u003C/a>.\u003C/p>\r\n\u003Cp>Our Sites use a variety of technologies, such as cookies, web beacons, and similar mechanisms, as described further below, to collect information that helps us understand how our Sites are used. We also may use similar tracking technologies in emails that we or third parties send to you, as further described below. When you visit our Sites, you have the ability to accept or reject these cookies and other tracking mechanisms, except those that are strictly necessary in order for you to enter and use the Sites, and you can change your preference at any time using the preference indicator at the top of this page.\u003C/p>\r\n\u003Ch3>What is a cookie?\u003C/h3>\r\n\u003Cp>A cookie is a small file of letters and numbers that is stored on your computer or other device when you visit a website. Cookies contain information that is transferred to or read on your device and allow websites to recognise devices and store certain information, such as user preferences. Cookies are used to distinguish you from other users of our Sites. This helps us to provide you with a useful experience when you browse our Sites and also allows us to improve our Sites. We and our third-party service providers (“service providers”) use session cookies, which link your actions during a particular browser session and expire at the end of that session, as well as persistent cookies, which remain on your device and allow us to remember your actions or preferences across multiple browser sessions.\u003C/p>\r\n\u003Cp>Our Sites use an application known as a &quot;web beacon&quot; (also known as a &quot;pixel tag&quot; or &quot;clear gif&quot;). A web beacon is an electronic file that usually consists of a single-pixel image embedded in a web page or an email to measure usage and activity. In some cases, a web beacon triggers the placement or updating of a persistent cookie on your device.\u003C/p>\r\n\u003Ch3>What cookies do we use and why?\u003C/h3>\r\n\u003Cp>The cookies used on our Sites are categorised as follows:\u003C/p>\r\n\u003Cp>\u003Cb>Strictly Necessary Cookies\u003C/b>\u003C/p>\r\n\u003Cp>We use Strictly Necessary cookies to ensure our website is functioning properly. For instance, to help you complete common online requests, like setting your privacy preferences, logging onto your account, and completing forms online. These cookies are set by default and cannot be disabled.\u003C/p>\r\n\u003Cp>\u003Cb>Performance Cookies\u003C/b>\u003C/p>\r\n\u003Cp>Performance cookies allow us to measure website traffic and the popularity of pages. This data collected is used to measure and improve the website experience for our clients and visitors to the website.&nbsp; If you turn off these cookies your personal information will not be included in our aggregated data, and we will not be able to know when you have visited our site. If you grant us your consent, we use cookies for website analytics, by collecting, either directly or through our service providers, a variety of technical and navigational information, including as applicable: your computer or device type; operating system version; browser type and version; user agent string; internet connection type; mobile network provider; date and time of your visit; time since your last visit; web pages you view; links you click; searches conducted on the Sites; the internet protocol (IP) address used to access our Sites; your general geographic location (e.g. your city, postal code, or metropolitan region); and the website visited before our Sites. This information may be used, for example, to alert you to software compatibility issues or to resolve technical or service problems. We also analyze this information, with the assistance of our service providers, to improve our web design and functionality and to enhance our ability to serve you and your accounts.\u003C/p>\r\n\u003Cp>In particular, our Sites use&nbsp;\u003Ca href=\"http://www.adobe.com/privacy/analytics.html\" target=\"_blank\" title=\"Adobe Analytics\">Adobe Analytics\u003C/a>&nbsp;to help collect and analyses certain information for the web analytics purposes discussed in this section. You may opt out of the use of specific cookies by Adobe Analytics&nbsp;\u003Ca href=\"http://www.adobe.com/privacy/opt-out.html\" target=\"_blank\" title=\"Adobe Analytics opt out\">here\u003C/a>\u003C/p>\r\n\u003Cp>\u003Cb>Functional Cookies\u003C/b>\u003C/p>\r\n\u003Cp>We use Functional cookies to improve the functionality and personalization on our website and the services that we offer.&nbsp; If you reject these cookies some or all of the services may not function properly.\u003C/p>\r\n\u003Cp>\u003Cb>Targeting Cookies\u003C/b>\u003C/p>\r\n\u003Cp>Targeting cookies allow us to display advertising on this site adapted to you by combining data from your browsing habits and data from Vanguard and third-party customer databases.&nbsp; These cookies identify your unique browser, internet device, geographic location, and similar information. If you disable these cookies, we cannot send you advertising tailored to you and your investment interests.\u003C/p>\r\n\u003Cp>Because we respect your privacy, Vanguard is selective when choosing advertising partners. If you grant us your consent, we use Targeting cookies that permit us, through our service providers, including social networks, to provide targeted advertising services that are customized based on your online activities over time and across unaffiliated websites (Interest-Based Advertising) and to help us measure brand awareness and the effectiveness of our online advertising. These service providers use cookies, web beacons, and other similar technologies to collect information about your activity on our Sites, and they may combine it with information about your activity on other, unaffiliated websites. We and our service providers may use data collected on our Sites, together with other information we have about you and your Vanguard relationships, to target ads for Vanguard products and services to you on non-Vanguard websites as you browse the web. In addition, our service providers might use information collected during your use of our Sites to help target non-Vanguard advertisements based on your online activity in general.\u003C/p>\r\n\u003Cp>For more information about Interest-Based Advertising and how to grant and withdraw your consent with browser headers, please visit: \u003Ca href=\"http://optout.networkadvertising.org/?c=1\" target=\"_blank\" title=\"Network Advertising Initiative (NAI) opt-out page\">Network Advertising Initiative (NAI) opt-out page\u003C/a>; and \u003Ca href=\"http://www.youronlinechoices.eu/\" target=\"_blank\" title=\"European Interactive Digital Advertising Alliance (EDAA) opt-out page\">European Interactive Digital Advertising Alliance (EDAA) opt-out page\u003C/a>&nbsp;(available in 27 languages).\u003C/p>\r\n\u003Cp>The information generated about your use of our Sites may be transmitted to and stored by on servers outside your country of residence. As a result, where the information we collect is transferred to and processed in the United States or anywhere else outside the United Kingdom (UK) for the purposes described in this policy, we will take steps to ensure that the information receives the same level of protection as if it remained within the UK, including entering into data transfer agreements and/or using approved standard contractual clauses. You can ask to obtain a copy of, or reference to, the safeguards under which your personal data is transferred outside of the EEA by sending us an email at&nbsp;\u003Ca href=\"mailto:privacy@vanguard.com\">privacy@vanguard.com\u003C/a>. You also may contact us by sending a message to:\u003C/p>\r\n\u003Cp>Vanguard Asset Management Limited\u003Cbr>\r\nAttn: Data Protection Officer\u003Cbr>\r\n25 Walbrook\u003Cbr>\r\nLondon, GB EC4N 8AF\u003C/p>\r\n\u003Cp>We may redact data transfer agreements to protect commercial terms.\u003C/p>\r\n\u003Ch3>Third-party cookie privacy policies\u003C/h3>\r\n\u003Cul>\r\n\u003Cli>\u003Ca title=\"Adobe privacy policy\" href=\"https://www.adobe.com/privacy/experience-cloud.html\" target=\"_blank\">Adobe\u003C/a>\u003C/li>\r\n\u003Cli>\u003Ca title=\"Google privacy policy\" href=\"https://policies.google.com/technologies/cookies#types-of-cookies\" target=\"_blank\">Google\u003C/a>\u003C/li>\r\n\u003Cli>\u003Ca title=\"LinkedIn privacy policy\" href=\"https://www.linkedin.com/legal/l/cookie-table#thirdparty\" target=\"_blank\">LinkedIn\u003C/a>\u003C/li>\r\n\u003C/ul>\r\n\u003Ch3>How to withdraw your consent or delete or block our cookies\u003C/h3>\r\n\u003Cp>You can change your cookie preferences at any time using our cookie preference tool. By choosing &quot;Accept all cookies,&quot; you agree to the use of all cookies on our website. You can also reject all cookies (except the Strictly Necessary Cookies) by clicking “Reject All” and you can control the cookie types you wish to allow by selecting &quot;Manage cookies&quot; below. Rejecting cookies won't prevent you from accessing Vanguard's site.\u003C/p>\r\n\u003Cp>By clicking on the cookie on each category of cookies, you will see the list of cookies corresponding to each category with a&nbsp; &lt;Yes / No&gt;&nbsp; button allowing you to make your choice to accept or refuse, regarding each category of cookie. Once you have made your choice, you should click on «Confirm My Choices». You can also reject or accept all categories by clicking on the appropriate buttons.\u003C/p>\r\n\u003Cp>If you are concerned about having cookies on your computer, you can set your browser to refuse all cookies or to indicate when a cookie is being set, allowing you to decide whether to accept it. You can also delete cookies from your device. The help feature on most web browsers will tell you how to prevent your browser from accepting new cookies, how to receive notice when a new cookie is set, and how to disable cookies altogether. However, if you choose to block or delete cookies, certain features of our Sites may not operate correctly.\u003C/p>\r\n\u003Cp>If you change the settings on your web browser or delete your cookies, in either case so that Vanguard is not able to detect any prior cookie preferences you may have indicated, you may be presented with the consent option again the next time you visit our Sites.\u003C/p>\r\n\u003Cp>For further information about deleting or blocking cookies, please visit:&nbsp;\u003Cu>\u003Ca href=\"http://www.allaboutcookies.org/manage-cookies/\">http://www.allaboutcookies.org/manage-cookies/\u003C/a>\u003C/u>.\u003C/p>\r\n\u003Cp>\u003Ci>Revised March 2022\u003C/i>\u003C/p>\r\n",":type":"europe-aem/components/common/cookie-policy"}},":itemsOrder":["navigation-header","meta-data","site-config","app-megamenu-header","header-mega-menu","breadcrumbs","responsivegrid","footer","cookie-policy"],":type":"wcm/foundation/components/responsivegrid"}},":itemsOrder":["root"],":children":{}},"_aem_vanity_url_state":{},"__nghData__":[{"t":{"0":"t0"},"c":{"0":[{"i":"t0","r":2,"e":{"0":1},"t":{"1":"t1"},"c":{"1":[]}}]}},{},{"c":{"0":[],"2":[],"3":[{"i":"t9","r":2,"e":{"0":1}}],"4":[]},"t":{"2":"t8","3":"t9","4":"t10"}},{"t":{"2":"t11"},"c":{"2":[]}},{"t":{"2":"t15","5":"t16"},"c":{"2":[],"5":[]}},{"t":{"2":"t15","5":"t16"},"c":{"2":[{"i":"t15","r":1}],"5":[]}},{"t":{"1":"t47","2":"t48","3":"t49","4":"t50","5":"t51","6":"t52","7":"t53","8":"t54"},"c":{"1":[{"i":"t47","r":1}],"2":[],"3":[{"i":"t49","r":1}],"4":[],"5":[],"6":[],"7":[],"8":[]}},{"t":{"0":"t41","1":
