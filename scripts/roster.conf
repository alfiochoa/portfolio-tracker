# The team's agents, in layout order: role | role file in .claude/agents | model | effort | dev port
# The architect and the designer take the top row of the Office tab; the builders and the verifier the bottom.
# The architect works in the main checkout; everyone else in <repo>-worktrees/<role>.
# Change models and effort freely. Ports must not collide with another team on the same machine.
#
# Three agents by default (docs/team/README.md): the architect runs the loop, builder-1 builds, the
# verifier checks. The architect has a port because it runs the check command after each merge.
# A commented-out role is off: `recover`, `status` and the views leave it alone. `scripts/team.sh join <role>
# <pane-to-split> right|down` brings one in (and uncomments its line): the designer for direction options the
# owner chooses between, builder-2 when tasks run in parallel. `scripts/team.sh bench <role>` takes it off again.
