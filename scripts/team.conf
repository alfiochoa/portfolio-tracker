# This project's agent team. Written by agent-team-kit/install.sh; edit freely. Read by scripts/team.sh
# and the monitoring scripts. Lines are KEY="value"; the roster (who runs on what model) is roster.conf.

# The team's name, shown in notifications and on the dashboard.
PROJECT="portfolio-tracker"

# Herdr needs agent names to be unique across everything it runs. With a prefix, the role `builder-1` is
# the Herdr agent `ex-builder-1`, so a second project's team can run beside this one. Commands take roles;
# only the calls to Herdr use the prefixed name. Empty for plain names. Lowercase letters and digits.
PREFIX="pt"

# The person the team works for: named in what the agents write, and the file the architect keeps for
# them in .team is named after them (OWNER="Ana" gives for-ana.md; empty gives "the owner" and for-owner.md).
OWNER="Alfredo"

# The branch the team works on: tasks branch from it and merge back into it, the architect tags and pushes
# it, and the workers' worktrees are made from it. "main" for most repositories; "dev" where that is the trunk.
BRANCH="main"

# What Claude Code may do without asking. "bypassPermissions" is what a team that works unattended
# needs; empty for Claude Code's own default (every risky command then stops at a prompt).
PERMISSION_MODE="bypassPermissions"

# Claude Code asks whether to trust a folder the first time it opens it. Only the machine's owner can say
# yes: set this to "yes" once the owner has approved it for this repository and its worktrees; until then an
# agent that asks is left waiting and the script says which pane to look at.
ACCEPT_FOLDER_TRUST="yes"

# "yes" when the project runs Playwright browser tests on this Mac: the Awake tab then runs
# scripts/memory-guard.sh, which kills a browser helper that grows past 6 GB before it takes the
# screen down.
MEMORY_GUARD="no"

# A regular expression (Python) of commands this project forbids on top of the kit's guard (scripts/team-guard.py:
# the Mac's apps, force-pushes, logins, pkill, rm outside the repository). Example for a site where a deploy is
# the owner's decision: GUARD_DENY="wrangler (deploy|publish|secret)". Empty for none.
GUARD_DENY=""

# "yes" to switch the architect's Remote Control (reach it from the Claude app on a phone) back on
# whenever the script restarts it. The link changes at each restart; it is in the /remote-control dialog.
REMOTE_CONTROL="no"

# The model fallback. When the account runs out of one model's usage (Claude Code ends the turn with "You're out of
# usage credits ... /model to switch models"), the agents on that model would stop until the limit resets, days
# later. The Awake tab runs scripts/team-fallback.py, which restarts such an agent on FALLBACK_MODEL at
# FALLBACK_EFFORT with its conversation, and puts it back on its roster model when the limit has reset. No model
# calls. FALLBACK_MODEL="" turns it off.
FALLBACK_MODEL="claude-opus-5-5"
FALLBACK_EFFORT="xhigh"

# Task tiers: "yes" lets the architect give each task a tier in its brief ("Tier: light", "Tier: standard" or
# "Tier: heavy", with the reason), and `scripts/team.sh assign` runs that task and its verification on the tier's
# model and effort, for that task only. Light and heavy are "model|effort"; standard is the roster's. The cost
# ledger sums the tasks by tier. Off by default: a project turns it on to try it and keeps it if the ledger and
# the eval set say it pays.
TASK_TIERS="no"
TIER_LIGHT="claude-sonnet-5-5|high"
TIER_HEAVY="claude-opus-5-5|xhigh"

# A partner team: another person's team that works on this repository from its own machine, through GitHub only
# (issues for requests and questions, pull requests for work; none of the owner's credentials; no live link). Empty
# for none. With a name, the Awake tab runs the listener that wakes the architect when the other team does something
# on GitHub, and the dashboard and the office show the two teams' traffic. PARTNER_DIR holds their roster and the
# rules both teams follow (install.sh --partner writes it); PARTNER_LABELS are the issue labels the dashboard names.
# The partner's machine runs these same scripts after `scripts/team.sh init --side partner`.
PARTNER=""
PARTNER_DIR="partner-team"
PARTNER_LABELS=""

# More always-on views for the Awake tab, one "pane label|process to look for|command" each (bash array). `awake`
# starts them beside keep-awake, and `recover` restarts one whose process is gone. Example:
#   VIEWS_EXTRA=("deploy log|tail -F logs/deploy.log|tail -F logs/deploy.log")
VIEWS_EXTRA=()

# Kit files this project has made its own, space-separated paths: install.sh writes them only when missing and
# never counts them as edited, so an update neither stops on them nor replaces them. Example: a project whose
# docs/team/README.md describes its own roster and history: KIT_OWN="docs/team/README.md". Empty for none.
KIT_OWN=""
